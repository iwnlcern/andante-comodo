name: SPC4 SnapPy core dependency relay

on:
  push:
    branches:
      - spc4-cypari-wheel-20260809
    paths:
      - '.github/workflows/spc4-snappy-core-deps.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download available runtime wheels independently
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifact
          : > artifact/availability.txt
          for pkg in 'plink>=2.4.9' 'FXrays>=1.3' 'snappy_manifolds>=1.4' 'low_index>=1.3' 'tkinter-gl>=1.0' pypng PyX pickleshare; do
            if python -m pip download --only-binary=:all: --no-deps --dest artifact "$pkg"; then
              echo "OK $pkg" >> artifact/availability.txt
            else
              echo "MISSING $pkg" >> artifact/availability.txt
            fi
          done
          sha256sum artifact/*.whl | sort | tee artifact/SHA256SUMS
          cat artifact/availability.txt
      - uses: actions/upload-artifact@v4
        with:
          name: spc4-snappy-core-deps-cp313-linux
          path: artifact/
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
