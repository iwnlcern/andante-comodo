name: SPC4 SnapPy dependency relay

on:
  push:
    branches:
      - spc4-cypari-wheel-20260809
    paths:
      - '.github/workflows/spc4-snappy-deps.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download SnapPy runtime dependencies
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifact
          python -m pip download --only-binary=:all: --dest artifact \
            'plink>=2.4.9' \
            'FXrays>=1.3' \
            'snappy_manifolds>=1.4' \
            'veering-16>=1.0.6' \
            'low_index>=1.3' \
            'tkinter-gl>=1.0' \
            pypng PyX pickleshare
          sha256sum artifact/* | sort | tee artifact/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: spc4-snappy-deps-cp313-linux
          path: artifact/
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
